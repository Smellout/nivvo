name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # Chave de assinatura fixa: sem ela, cada build sai com uma chave diferente
      # e o Android exige desinstalar o app para atualizar.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 ausente: APK assinado com chave de debug temporaria."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/nivvo-release.jks
          {
            echo "storeFile=nivvo-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=nivvo"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define="SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nivvo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Get current date
        if: github.ref == 'refs/heads/main'
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.date.outputs.date }}
          name: Nivvo APK - ${{ steps.date.outputs.date }}
          body: |
            Build automatico do Nivvo APK.
            Baixe o arquivo **app-release.apk** abaixo e instale no seu Android.
          files: build/app/outputs/flutter-apk/app-release.apk
