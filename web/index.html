<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Nivvo — controle financeiro simplificado.">
  <meta name="theme-color" content="#05070F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nivvo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Nivvo</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #03040A; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; gap: 56px; }

    /* Moldura de celular no desktop */
    #nivvo-phone {
      position: relative;
      width: 390px; height: 844px; max-height: calc(100vh - 48px);
      border-radius: 46px; overflow: hidden;
      background: #05070F;
      box-shadow: 0 0 0 10px #12172A, 0 0 0 11px #262D47, 0 30px 90px rgba(43,91,255,.25);
    }
    #side { color: #8B93A7; max-width: 300px; font-size: 14px; line-height: 1.55; }
    #side h1 { color: #fff; font-size: 30px; letter-spacing: -1px; margin: 16px 0 4px; }
    #side .tag { color: #8AA6FF; font-weight: 600; }
    #side ul { padding-left: 18px; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8B93A7; font-size: 13px; }

    /* Em celular/tela estreita: o app ocupa a tela toda */
    @media (max-width: 760px) {
      body { display: block; }
      #side { display: none; }
      #nivvo-phone { width: 100vw; height: 100vh; height: 100dvh; max-height: none; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div id="nivvo-phone"><div id="loading">Carregando Nivvo…</div></div>
  <aside id="side">
    <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F7DFF"/><stop offset="1" stop-color="#7A5CFF"/></linearGradient></defs>
      <rect width="24" height="24" rx="7" fill="url(#g)"/>
      <g transform="translate(2.9 2.9) scale(.76)"><path d="M6 18V6l12 12v-7.5" fill="none" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="6" r="1.9" fill="#fff"/></g>
    </svg>
    <h1>nivvo</h1>
    <div class="tag">Prévia no navegador</div>
    <p>Este é o app real do Nivvo rodando no navegador, com as mesmas telas e regras da versão Android.</p>
    <ul>
      <li>Notificações de vencimento só funcionam no Android.</li>
      <li>Abra este endereço no celular para ver em tela cheia.</li>
    </ul>
  </aside>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
